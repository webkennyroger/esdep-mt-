services:
  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      AUTO_MIGRATE: "true"
    volumes:
      - esdep_storage:/var/www/html/storage
      - ./app:/var/www/html/app
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./config:/var/www/html/config
      - ./database/migrations:/var/www/html/database/migrations
      - ./database/seeders:/var/www/html/database/seeders
      - ./public/build:/var/www/html/public/build
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  scheduler:
    build:
      context: .
      target: app
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      AUTO_MIGRATE: "false"
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - esdep_storage:/var/www/html/storage
      - ./app:/var/www/html/app
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./config:/var/www/html/config
      - ./database/migrations:/var/www/html/database/migrations
      - ./database/seeders:/var/www/html/database/seeders
    depends_on:
      app:
        condition: service_healthy

  worker:
    build:
      context: .
      target: app
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      AUTO_MIGRATE: "false"
    command:
      - php
      - artisan
      - queue:work
      - --sleep=3
      - --tries=3
      - --timeout=120
    volumes:
      - esdep_storage:/var/www/html/storage
      - ./app:/var/www/html/app
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./config:/var/www/html/config
      - ./database/migrations:/var/www/html/database/migrations
      - ./database/seeders:/var/www/html/database/seeders
    depends_on:
      app:
        condition: service_healthy


  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - esdep_storage:/var/www/html/storage:ro
      - ./public/build:/var/www/html/public/build

  vite:
    build:
      context: .
      target: frontend
    restart: unless-stopped
    working_dir: /app
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    command: ["npm", "run", "build", "--", "--watch"]
    volumes:
      - ./resources:/app/resources
      - ./public/build:/app/public/build
      - ./vite.config.js:/app/vite.config.js

volumes:
  esdep_storage:

networks:
  default:
    ipam:
      config:
        - subnet: 172.19.0.0/16
          gateway: 172.19.0.1
