services:
  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      AUTO_MIGRATE: "true"
    volumes:
      - esdep_database:/var/www/html/database
      - esdep_storage:/var/www/html/storage
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  scheduler:
    build:
      context: .
      target: app
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      AUTO_MIGRATE: "false"
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - esdep_database:/var/www/html/database
      - esdep_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy

  worker:
    build:
      context: .
      target: app
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      AUTO_MIGRATE: "false"
    command:
      - php
      - artisan
      - queue:work
      - --sleep=3
      - --tries=3
      - --timeout=120
    volumes:
      - esdep_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy


  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - esdep_storage:/var/www/html/storage:ro

volumes:
  esdep_database:
  esdep_storage:

networks:
  default:
    ipam:
      config:
        - subnet: 172.19.0.0/16
          gateway: 172.19.0.1
